<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Andy Learning</title>
    <meta name="description" content="Những gì mình đã học và các chứng chỉ đạt được." />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="container nav">
        <a href="#top" class="brand" id="brand">Andy</a>
        <ul class="nav-links">
          <li><a href="#learning">Đã học</a></li>
          <li><a href="#certificates">Chứng chỉ</a></li>
          <li><a href="#about">Giới thiệu</a></li>
        </ul>
      </nav>
    </header>

    <main id="top">
      <section class="hero container">
        <h1 id="hero-name"></h1>
        <p class="tagline" id="hero-tagline"></p>
        <div class="stats">
          <div class="stat"><span id="stat-learning">0</span><small>chủ đề đã học</small></div>
          <div class="stat"><span id="stat-certs">0</span><small>chứng chỉ</small></div>
        </div>
      </section>

      <section id="learning" class="container section">
        <div class="section-head">
          <h2>Những gì đã học</h2>
          <div class="filters" id="filters" role="group" aria-label="Lọc theo chủ đề"></div>
        </div>
        <ol class="timeline" id="learning-list"></ol>
      </section>

      <section id="certificates" class="container section">
        <div class="section-head">
          <h2>Chứng chỉ</h2>
        </div>
        <div class="cert-grid" id="cert-list"></div>
      </section>

      <section id="about" class="container section">
        <div class="section-head">
          <h2>Giới thiệu</h2>
        </div>
        <p id="about-text"></p>
        <ul class="links" id="profile-links"></ul>
      </section>
    </main>

    <footer class="site-footer container">
      <small>© <span id="year"></span> <span id="footer-name"></span></small>
    </footer>

    <script src="data.js"></script>
    <script src="main.js"></script>
  </body>
</html>
